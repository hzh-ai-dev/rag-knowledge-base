services:
  rag-app:
    build: .
    image: rag-knowledge-base:latest
    container_name: rag-knowledge-base
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 持久化向量库与上传文件，容器重建不丢数据
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
